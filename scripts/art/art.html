<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Yuji; src: url("../../resources/fonts/YujiSyuku.subset.woff2"); }
@font-face { font-family: Shippori; src: url("../../resources/fonts/ShipporiMincho-Bold.subset.woff2"); font-weight: 700; }
@font-face { font-family: Plex; src: url("../../resources/fonts/IBMPlexSans.subset.woff2"); font-weight: 100 700; }
html, body { margin: 0; background: transparent; }
.stage { position: relative; overflow: hidden; }
/* App icon: washi tile, ink ensō, vermilion seal. */
.icon { width: 1024px; height: 1024px; }
.tile { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
  background: radial-gradient(120% 120% at 30% 20%, #fbf8f1 0%, #f1eadc 60%, #e6dccb 100%);
  box-shadow: inset 0 0 0 2px #00000010, 0 24px 40px #0000002a; overflow: hidden; }
.tile::after { content: ""; position: absolute; inset: 0;
  background-image: radial-gradient(circle at 20% 30%, #0000000a 0 1.2px, transparent 2px), radial-gradient(circle at 70% 80%, #00000008 0 1.2px, transparent 2px);
  background-size: 9px 11px, 13px 15px; }
.enso { position: absolute; left: 0; top: 0; }
.seal { position: absolute; display: grid; place-items: center; background: #c63c2b; color: #fbf4ea; font-family: Yuji;
  box-shadow: inset 0 0 0 10px #ffffff1c; }
.big .seal { left: 512px; top: 512px; width: 420px; height: 420px; margin: -210px 0 0 -210px; border-radius: 64px; font-size: 330px; transform: rotate(-4deg); }
/* Banner */
.banner { width: 1600px; height: 560px; display: flex; align-items: center; gap: 70px; padding: 0 120px; box-sizing: border-box; font-family: Plex; }
.banner.light { background: #f3eee4; color: #1e1a15; } .banner.dark { background: #16130f; color: #efe7d8; }
.banner .mark { position: relative; width: 300px; height: 300px; flex: none; }
.banner .mark .seal { inset: 62px; border-radius: 30px; font-size: 140px; transform: rotate(-4deg); }
.banner.dark .mark .seal { background: #e2553f; }
.banner h1 { font: 700 128px/1 Shippori; margin: 0; letter-spacing: .02em; }
.banner h1 small { font: 400 52px Yuji; margin-left: 24px; opacity: .55; }
.banner p { font-size: 38px; margin: 26px 0 0; opacity: .75; }
.banner .vert { writing-mode: vertical-rl; font: 400 40px Yuji; letter-spacing: .3em; margin-left: auto; opacity: .35; }
.tray { width: 64px; height: 64px; display: grid; place-items: center; font: 400 60px/1 Yuji; color: #000; }
</style></head>
<body>
<div id="icon" class="stage icon big">
  <div class="tile">
    <svg class="enso" width="824" height="824" viewBox="0 0 824 824">
      <g transform="rotate(-35 412 412)" fill="none" stroke="#1e1a15" stroke-linecap="round">
        <circle cx="412" cy="412" r="310" stroke-width="54" stroke-dasharray="1700 300" opacity=".88"/>
        <circle cx="412" cy="412" r="296" stroke-width="18" stroke-dasharray="1500 500" opacity=".35"/>
        <circle cx="412" cy="412" r="326" stroke-width="10" stroke-dasharray="900 1200" opacity=".25"/>
      </g>
    </svg>
  </div>
  <div class="seal">猿</div>
</div>
<div id="banner-light" class="stage banner light">
  <div class="mark">
    <svg class="enso" width="300" height="300" viewBox="0 0 824 824"><g transform="rotate(-35 412 412)" fill="none" stroke="#1e1a15" stroke-linecap="round"><circle cx="412" cy="412" r="380" stroke-width="44" stroke-dasharray="2050 400" opacity=".85"/></g></svg>
    <div class="seal">猿</div>
  </div>
  <div><h1>Saru<small>猿</small></h1><p>Write it your way. Send it in theirs.</p></div>
  <div class="vert">言わざる</div>
</div>
<div id="banner-dark" class="stage banner dark">
  <div class="mark">
    <svg class="enso" width="300" height="300" viewBox="0 0 824 824"><g transform="rotate(-35 412 412)" fill="none" stroke="#efe7d8" stroke-linecap="round"><circle cx="412" cy="412" r="380" stroke-width="44" stroke-dasharray="2050 400" opacity=".85"/></g></svg>
    <div class="seal">猿</div>
  </div>
  <div><h1>Saru<small>猿</small></h1><p>Write it your way. Send it in theirs.</p></div>
  <div class="vert">言わざる</div>
</div>
<div id="tray" class="stage tray">猿</div>
</body></html>
