<!doctype html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family: Yuji; src: url("../../resources/fonts/YujiSyuku.subset.woff2"); }
@font-face { font-family: ZenKaku; src: url("../../resources/fonts/ZenKakuGothicNew-Bold.subset.woff2"); font-weight: 700; }
@font-face { font-family: ZenKaku; src: url("../../resources/fonts/ZenKakuGothicNew-Regular.subset.woff2"); font-weight: 400; }
html, body { margin: 0; background: transparent; }
.stage { position: relative; overflow: hidden; }
.mark svg { width: 100%; height: 100%; display: block; }
/* App icon: a paper tile with the painted head. */
.icon { width: 1024px; height: 1024px; }
.tile { position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
  background: radial-gradient(120% 120% at 30% 20%, #f3e7d3 0%, #e8d8bd 60%, #dcc6a4 100%);
  box-shadow: inset 0 0 0 2px #3f1f1214, 0 24px 40px #3f1f122e; display: grid; place-items: center; }
.tile .mark { width: 700px; height: 700px; }
/* README banners. */
.banner { width: 1600px; height: 520px; display: flex; align-items: center; gap: 64px; padding: 0 120px; box-sizing: border-box; font-family: ZenKaku; }
.banner.light { background: #ecdfca; color: #3f1f12; } .banner.dark { background: #1b130e; color: #f1e4d0; --m-dark: #c98a55; --m-light: #3a2216; }
.banner .mark { width: 330px; height: 330px; flex: none; }
.banner h1 { font: 700 124px/1 ZenKaku; margin: 0; letter-spacing: .01em; }
.banner h1 small { font: 400 54px Yuji; margin-left: 24px; color: #8c4a27; }
.banner.dark h1 small { color: #d8b48a; }
.banner p { font-size: 38px; margin: 26px 0 0; opacity: .72; }
.banner .vert { writing-mode: vertical-rl; font: 400 27px Yuji; letter-spacing: .16em; line-height: 1.7; margin-left: auto; opacity: .45; }
/* Menu-bar glyph: a clean silhouette; the face is turned into transparency by render.cjs. */
.tray { width: 64px; height: 64px; --m-dark: #000; --m-light: #fff; --f-brush: none; --f-soft: none; }
</style></head>
<body>
<div id="icon" class="stage icon"><div class="tile"><div class="mark"></div></div></div>
<div id="banner-light" class="stage banner light">
  <div class="mark"></div>
  <div><h1>Saru<small>猿</small></h1><p>Write it your way. Send it in theirs.</p></div>
  <div class="vert">見ざる 聞かざる 言わざる</div>
</div>
<div id="banner-dark" class="stage banner dark">
  <div class="mark"></div>
  <div><h1>Saru<small>猿</small></h1><p>Write it your way. Send it in theirs.</p></div>
  <div class="vert">見ざる 聞かざる 言わざる</div>
</div>
<div id="tray" class="stage tray mark"></div>
</body></html>
