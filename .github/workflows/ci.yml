name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Plugin script is current
        run: git diff --exit-code -- plugin/scripts/saru.cjs
      - run: bun run check
      - run: bunx playwright test
        env:
          CI: "1"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Build the DMGs (not signed or notarised yet)
        run: bun run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Attach them to the release
        run: gh release create "$GITHUB_REF_NAME" release/*.dmg --title "Saru $GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
